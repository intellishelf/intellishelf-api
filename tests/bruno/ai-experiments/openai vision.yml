http:
  method: POST
  url: https://api.openai.com/v1/chat/completions
  body:
    type: json
    data: "{\n  \"model\": \"gpt-5.4-mini\",\n  \"messages\": [\n    {\n      \"role\": \"user\",\n      \"content\": [\n        {\n          \"type\": \"text\",\n          \"text\": \"You are a book page parser. You are given a verso book page which may include all information about book. I want add this to my personal library. Extract content language, title, author, publisher, year, pages, ISBN and annotation. Return as JSON. Language of content may be any so find out yourself. Don't translate content, don't rephrase content, just parse. Example: {'language': 'ua', 'title': 'Castle', author: 'Franz Kafka'}\"\n        },\n        {\n          \"type\": \"image_url\",\n          \"image_url\": {\n            \"detail\": \"high\",\n            \"url\": \"data:image/jpeg;base64,\"\n          }\n        }\n      ]\n    }\n  ],\n  \"max_completion_tokens\": 1500\n}"
  auth:
    type: bearer
    token: '{{open_ai_api_key}}'
